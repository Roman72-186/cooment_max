events { worker_connections 1024; }

http {
  # Апстримы — имена совпадают с именами Docker-контейнеров
  upstream mc_bot     { server mc_bot:3000; }
  upstream mc_backend { server mc_backend:3001; }

  # HTTP → редирект на HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # HTTPS — основной сервер
  server {
    listen 443 ssl;
    # Заменить на реальный домен или IP перед деплоем
    server_name 89.169.2.231;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Настройки SSL
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Webhook MAX бота
    location /webhook {
      proxy_pass http://mc_bot;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API для Mini App
    location /api/ {
      proxy_pass http://mc_backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # CORS — Mini App обращается с другого домена (Vercel)
      add_header Access-Control-Allow-Origin  *;
      add_header Access-Control-Allow-Methods 'GET, POST, DELETE, OPTIONS';
      add_header Access-Control-Allow-Headers 'Authorization, Content-Type';

      # Preflight OPTIONS запросы
      if ($request_method = OPTIONS) {
        return 204;
      }
    }
  }
}

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types
    text/plain
    text/css
    text/xml
    application/json
    application/javascript
    application/xml
    image/svg+xml;

  # Апстримы — имена совпадают с именами Docker-контейнеров
  upstream mc_bot     { server mc_bot:3000; }
  upstream mc_backend { server mc_backend:3001; }
  upstream masterorg  { server masterorg:4321; }
  upstream stroka_editor { server stroka-editor:8788; }

  # HTTP → редирект на HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # HTTPS — основной сервер
  server {
    listen 443 ssl;
    server_name legal72.ru;

    ssl_certificate     /etc/nginx/ssl/legal72.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/legal72.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 12m;

    location / {
      proxy_pass http://masterorg;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # Публичный редактор и страницы «Строка»
  server {
    listen 443 ssl;
    server_name stroka.legal72.ru;

    ssl_certificate     /etc/nginx/ssl/stroka.legal72.ru/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/stroka.legal72.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Приложение принимает изображения до 8 МБ; запас нужен для multipart.
    client_max_body_size 9m;

    location / {
      proxy_pass http://stroka_editor;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }
  }

  server {
    listen 443 ssl;
    server_name comment-max.ru;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Health check бэкенда
    location /health {
      proxy_pass http://mc_backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook MAX бота
    location /webhook {
      proxy_pass http://mc_bot;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API для Mini App (CORS в самом бэкенде)
    location /api/ {
      client_max_body_size 8m;
      proxy_pass http://mc_backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Юридические документы — статика
    location /legal {
      root /var/www;
      default_type text/html;
      charset utf-8;
      add_header Cache-Control "public, max-age=3600";
      try_files $uri $uri.html $uri/ =404;
    }

    # Короткие ссылки на комментарии: /c/:id → редирект в MAX
    location /c/ {
      proxy_pass http://mc_backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mini App assets — Vite кладёт hash в имя файла, можно кешировать надолго.
    location /assets/ {
      root  /var/www/miniapp;
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Entry point Mini App — без кеша, чтобы обновления SPA применялись сразу.
    location = /index.html {
      root  /var/www/miniapp;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Mini App — React SPA (собирается в Docker build-stage)
    location / {
      root  /var/www/miniapp;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
  }

}

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Апстримы — имена совпадают с именами Docker-контейнеров
  upstream mc_bot     { server mc_bot:3000; }
  upstream mc_backend { server mc_backend:3001; }

  # HTTP → редирект на HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  # HTTPS — основной сервер
  server {
    listen 443 ssl;
    server_name comment-max.ru;

    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Health check бэкенда
    location /health {
      proxy_pass http://mc_backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook MAX бота
    location /webhook {
      proxy_pass http://mc_bot;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API для Mini App (CORS в самом бэкенде)
    location /api/ {
      proxy_pass http://mc_backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Юридические документы — статика
    location /legal {
      root /var/www;
      default_type text/html;
      charset utf-8;
      add_header Cache-Control "public, max-age=3600";
      try_files $uri $uri.html $uri/ =404;
    }

    # Короткие ссылки на комментарии: /c/:id → редирект в MAX
    location /c/ {
      proxy_pass http://mc_backend;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Mini App — React SPA (собирается в Docker build-stage)
    location / {
      root  /var/www/miniapp;
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
  }
}

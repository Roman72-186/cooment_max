version: '3.9'

networks:
  max-comments-net:
    name: max-comments-net
    driver: bridge

volumes:
  mc_redis_data:
  mc_postgres_data:

services:

  # 1. PostgreSQL — локальная БД
  mc_postgres:
    image: postgres:16-alpine
    container_name: mc_postgres
    restart: unless-stopped
    networks: [max-comments-net]
    volumes:
      - mc_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: maxcomments
      POSTGRES_USER: mcuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  # 2. Redis — кэш и очередь задач
  mc_redis:
    image: redis:7-alpine
    container_name: mc_redis
    restart: unless-stopped
    networks: [max-comments-net]
    volumes:
      - mc_redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}

  # 3. Bot — принимает webhook-события MAX
  mc_bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    container_name: mc_bot
    restart: unless-stopped
    networks: [max-comments-net]
    depends_on: [mc_postgres, mc_redis]
    env_file: .env

  # 4. Backend — REST API для Mini App
  mc_backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: mc_backend
    restart: unless-stopped
    networks: [max-comments-net]
    depends_on: [mc_postgres, mc_redis]
    env_file: .env

  # 5. Nginx — обратный прокси, SSL терминация
  mc_nginx:
    image: nginx:alpine
    container_name: mc_nginx
    restart: unless-stopped
    networks: [max-comments-net]
    depends_on: [mc_bot, mc_backend]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'

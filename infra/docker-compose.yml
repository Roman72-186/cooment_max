networks:
  max-comments-net:
    name: max-comments-net
    driver: bridge

volumes:
  mc_postgres_data:

services:

  # 1. PostgreSQL — локальная БД
  mc_postgres:
    image: postgres:16-alpine
    container_name: mc_postgres
    restart: unless-stopped
    networks: [max-comments-net]
    volumes:
      - mc_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: maxcomments
      POSTGRES_USER: mcuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcuser -d maxcomments"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 3. Bot — принимает webhook-события MAX
  mc_bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    container_name: mc_bot
    restart: unless-stopped
    networks: [max-comments-net]
    depends_on:
      mc_postgres:
        condition: service_healthy
    env_file: .env
    dns:
      - 85.193.93.194
      - 85.193.93.193
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 4. Backend — REST API для Mini App
  mc_backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: mc_backend
    restart: unless-stopped
    networks: [max-comments-net]
    depends_on:
      mc_postgres:
        condition: service_healthy
    env_file: .env
    dns:
      - 85.193.93.194
      - 85.193.93.193
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 5. Nginx — раздаёт Mini App + обратный прокси для API/webhook
  mc_nginx:
    build:
      context: ..
      dockerfile: infra/Dockerfile.nginx
    container_name: mc_nginx
    restart: unless-stopped
    networks: [max-comments-net]
    depends_on:
      mc_bot:
        condition: service_healthy
      mc_backend:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./static/legal:/var/www/legal:ro
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'

version: '3.9'

# Изолированная сеть — только наши контейнеры общаются между собой
networks:
  max-comments-net:
    name: max-comments-net
    driver: bridge

# Именованные тома с префиксом mc_ — нет конфликтов с другими сервисами на VPS
volumes:
  mc_postgres_data:
  mc_redis_data:

services:

  # 1. PostgreSQL — изолированная база данных
  mc_postgres:
    image: postgres:15-alpine
    container_name: mc_postgres
    restart: unless-stopped
    networks: [max-comments-net]
    volumes:
      - mc_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      POSTGRES_DB:       ${DB_NAME:-maxcomments}
      POSTGRES_USER:     ${DB_USER:-mcuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  # 2. Redis — кэш и очередь задач
  mc_redis:
    image: redis:7-alpine
    container_name: mc_redis
    restart: unless-stopped
    networks: [max-comments-net]
    volumes:
      - mc_redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}

  # 3. Bot — принимает webhook-события MAX
  mc_bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    container_name: mc_bot
    restart: unless-stopped
    networks: [max-comments-net]
    depends_on: [mc_postgres, mc_redis]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@mc_postgres:5432/${DB_NAME}
      REDIS_URL:    redis://:${REDIS_PASSWORD}@mc_redis:6379

  # 4. Backend — REST API для Mini App
  mc_backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: mc_backend
    restart: unless-stopped
    networks: [max-comments-net]
    depends_on: [mc_postgres, mc_redis]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@mc_postgres:5432/${DB_NAME}
      REDIS_URL:    redis://:${REDIS_PASSWORD}@mc_redis:6379

  # 5. Nginx — обратный прокси, SSL терминация
  mc_nginx:
    image: nginx:alpine
    container_name: mc_nginx
    restart: unless-stopped
    networks: [max-comments-net]
    depends_on: [mc_bot, mc_backend]
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'

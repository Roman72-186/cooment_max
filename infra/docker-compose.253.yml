networks:
  max-comments-net:
    name: max-comments-net
    driver: bridge

volumes:
  mc_postgres_data:

services:

  # 1. PostgreSQL — локальная БД
  mc_postgres:
    image: postgres:16-alpine
    container_name: mc_postgres
    restart: unless-stopped
    networks: [max-comments-net]
    volumes:
      - mc_postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_DB: maxcomments
      POSTGRES_USER: mcuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcuser -d maxcomments"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 3. Bot — принимает webhook-события MAX. На хосте слушает только 127.0.0.1 — наружу смотрит host-nginx.
  mc_bot:
    image: infra-mc_bot:latest
    container_name: mc_bot
    restart: unless-stopped
    networks: [max-comments-net]
    depends_on:
      mc_postgres:
        condition: service_healthy
    env_file: .env
    dns:
      - 85.193.93.194
      - 85.193.93.193
    ports:
      - '127.0.0.1:3020:3000'
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 4. Backend — REST API для Mini App. На хосте слушает только 127.0.0.1 — наружу смотрит host-nginx.
  mc_backend:
    image: infra-mc_backend:latest
    container_name: mc_backend
    restart: unless-stopped
    networks: [max-comments-net]
    depends_on:
      mc_postgres:
        condition: service_healthy
    env_file: .env
    dns:
      - 85.193.93.194
      - 85.193.93.193
    ports:
      - '127.0.0.1:3021:3001'
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
